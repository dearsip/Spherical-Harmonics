<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050a14">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#050a14; overscroll-behavior:none; }
    #unity-container { position:fixed; inset:0; width:100%; height:100%; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing:border-box; }
    #unity-canvas { display:block; width:100%; height:100%; background:#050a14; touch-action:none; outline:none; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; color:#bfe7ff; font:600 15px system-ui,sans-serif; pointer-events:none; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading spherical harmonics…</div>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    };
    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => createUnityInstance(canvas, config, progress => {
      loading.textContent = `Loading spherical harmonics… ${Math.round(progress * 100)}%`;
    }).then(() => loading.remove()).catch(message => { loading.textContent = message; console.error(message); });
    document.body.appendChild(script);
  </script>
</body>
</html>
